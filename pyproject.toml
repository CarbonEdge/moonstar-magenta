[project]
name = "moonstar-magenta"
version = "0.1.0"
description = "Local Magenta RealTime experiments: offline generation, GPU timing, chunked streaming"
requires-python = ">=3.11,<3.13"
dependencies = [
    "magenta-rt",
    "pydantic-settings>=2",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]
analysis = ["yt-dlp", "librosa"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["moonstar_magenta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
